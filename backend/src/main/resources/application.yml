spring:
  application:
    name: eduai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eduai}
    username: ${SPRING_DATASOURCE_USERNAME:eduai}
    password: ${SPRING_DATASOURCE_PASSWORD:eduai_pass}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations (Step 2), not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

eduai:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-prod-please}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
